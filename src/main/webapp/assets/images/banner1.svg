<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1b2436" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Background Color -->
  <rect width="1200" height="480" fill="#0b0f19"/>
  <!-- Decorative Abstract Gradients -->
  <circle cx="900" cy="240" r="300" fill="#d4af37" opacity="0.15" filter="blur(80px)"/>
  <circle cx="200" cy="100" r="150" fill="#3b82f6" opacity="0.1" filter="blur(60px)"/>
  <rect width="1200" height="480" fill="url(#grad)"/>
  <!-- Text content -->
  <text x="100" y="180" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold" fill="#d4af37" letter-spacing="3">BỘ SƯU TẬP MỚI 2026</text>
  <text x="100" y="270" font-family="'Outfit', sans-serif" font-size="64" font-weight="800" fill="#fff" letter-spacing="1">PHONG CÁCH HÈ THỜI THƯỢNG</text>
  <text x="100" y="340" font-family="'Outfit', sans-serif" font-size="20" fill="#9ca3af">Khám phá các thiết kế tối giản, sang trọng và độc bản.</text>
  <!-- Golden Border lines -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#d4af37" stroke-width="4"/>
</svg>

  <circle cx="950" cy="200" r="280" fill="#ef4444" opacity="0.15" filter="blur(80px)"/>
  <rect width="1200" height="480" fill="url(#grad)"/>
  <!-- Text content -->
  <text x="100" y="180" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold" fill="#ef4444" letter-spacing="3">SIÊU ƯU ĐÃI LỚN NHẤT NĂM</text>
  <text x="100" y="270" font-family="'Outfit', sans-serif" font-size="64" font-weight="800" fill="#fff" letter-spacing="1">GIẢM GIÁ LÊN ĐẾN 50%</text>
  <text x="100" y="340" font-family="'Outfit', sans-serif" font-size="20" fill="#9ca3af">Áp dụng cho toàn bộ các sản phẩm trong bộ sưu tập Thu Đông.</text>
  <!-- Red Border lines -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#ef4444" stroke-width="4"/>
</svg>
